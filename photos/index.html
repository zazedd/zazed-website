<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An ongoing collection of photos by Leonardo Santos." />
    <title>Photos | Leonardo Santos</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="photos-page">
    <main class="photos-shell">
      <a class="photos-back" href="../">← Home</a>
      <div class="photos-layout">
        <aside class="photos-sidebar" aria-label="Photo albums">
          <nav></nav>
          <p class="gear">gear<br />nikon f3 + mf-14 data back<br />nikkor 50mm f/1.2 ai-s<br />nikkor af-d 35–105mm<br /><br />pentax km<br />smc pentax 55mm f/1.8</p>
